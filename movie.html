<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="search.js" defer></script>
    <title>Document</title>
</head>
<body>

    <section class="hero__search">
    <div class="hero__content--search">
        <h1>Looking for something Else?</h1>
        <form class="search-form">
            <input type="text" placeholder="Search for a movie..." aria-label="Search for a movie" >
            <button type="submit"> Search </button>
        </form>
    </div> 
</section>

 <section class="movie__grid--search">
        <div class="movie-card">
            <div class="movie-poster">
                <img src="" alt="Movie poster placeholder" >
            </div>
            
            <div class="movie-info">
                <h3>Movie Title</h3>
                <p class="movie-year">2026</p>
                <div class="movie-details">
                    <span>imdbID</span>
                </div>
                <button class="details-button"> View Details </button>
            </div>
        </div>
    
</body>
</html>
